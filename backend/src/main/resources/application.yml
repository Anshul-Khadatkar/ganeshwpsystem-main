server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ganpati-vargani

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ganpati_vargani}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate must never auto-generate/alter DDL.
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

# Non-secret WhatsApp / org settings. Real secrets (access token etc.)
# come from environment variables only - see whatsapp.secrets below.
app:
  organization:
    name: ${ORGANIZATION_NAME:Ganpati Mandal}
  security:
    jwt-secret: ${JWT_SECRET:}
    jwt-expiration-hours: ${JWT_EXPIRATION_HOURS:12}
    default-admin-username: ${ADMIN_USERNAME:}
    default-admin-password: ${ADMIN_PASSWORD:}
  whatsapp:
    provider: ${WHATSAPP_PROVIDER:mock}   # mock | meta-cloud-api
    webhook-verify-token: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:}
    secrets:
      access-token: ${WHATSAPP_ACCESS_TOKEN:}
      phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
      business-account-id: ${WHATSAPP_BUSINESS_ACCOUNT_ID:}
      api-version: ${WHATSAPP_API_VERSION:v21.0}
      app-id: ${WHATSAPP_APP_ID:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  debug:
    # Extra password required by POST /api/debug-controller-4719/clear-data (admin JWT also required).
    # Leave blank to disable the endpoint.
    clear-password: ${DEBUG_CLEAR_PASSWORD:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.example.ganpativargani: ${LOG_LEVEL:INFO}
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}
